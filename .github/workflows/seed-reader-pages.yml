name: Deploy Seed Reader

on:
  push:
    branches: [main]
    paths:
      - "seed-reader/**"
      - ".github/workflows/seed-reader-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "seed-reader-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Seed Reader
        uses: actions/upload-pages-artifact@v3
        with:
          path: "seed-reader"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
